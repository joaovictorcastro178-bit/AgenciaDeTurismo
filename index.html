<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <!-- Link Icones -->
    

    <title>Agencia de turismo</title>
</head>
<body>
    <!-- SEPARENDO FUNÇÕES -->

     <!-- HEADER -->
    <header>

        <!-- NAV: logo na esquerda e menu na direita -->
        <nav class="navegacao">
            <div class="container">
                <a href="#">
                    <img src="14BIS.png" alt="Logo da agência" class="logo">
                </a>

                <ul class="menu">
                    <li><a href="#ofertas">Ofertas</a></li>
                    <li><a href="#destinos">Destinos</a></li>
                    <li><a href="#pacotes">Pacotes</a></li>
                    <li><a href="#sobre">Sobre nós</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </div>
        </nav>

    </header>

    <!-- MAIN -->
    <main>

        <!-- ===== 1) CARROSSEL GRANDE DE OFERTAS ===== -->
        <section id="ofertas">
            <div id="carrosselOfertas" class="carousel carrossel">

                <div class="carousel-inner">

                    <!-- Slide 1 (o "active" faz ele aparecer primeiro) -->
                    <div class="carousel-item active">
                        <div class="slide">
                            <img src="img1" alt="Oferta 1" class="imagem-grande">
                            <div class="texto-oferta">
                                <h1>Salvador com 20% de desconto</h1>
                                <p>Aéreo e hotel juntos.</p>
                                <a href="#contato" class="botao">Ver oferta</a>
                            </div>
                        </div>
                    </div>

                    <!-- Slide 2 -->
                    <div class="carousel-item">
                        <div class="slide">
                            <img src="img2" alt="Oferta 2" class="imagem-grande">
                            <div class="texto-oferta">
                                <h1>Cruzeiros pelo Brasil</h1>
                                <p>Tudo incluído.</p>
                                <a href="#contato" class="botao">Ver oferta</a>
                            </div>
                        </div>
                    </div>

                    <!-- Slide 3 -->
                    <div class="carousel-item">
                        <div class="slide">
                            <img src="img3" alt="Oferta 3" class="imagem-grande">
                            <div class="texto-oferta">
                                <h1>Férias em Gramado</h1>
                                <p>Pacote com café da manhã.</p>
                                <a href="#contato" class="botao">Ver oferta</a>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Setas para voltar e avançar  (M A L D I T A S) -->
                <button class="seta seta-esquerda" type="button" data-bs-target="#carrosselOfertas" data-bs-slide="prev">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button class="seta seta-direita" type="button" data-bs-target="#carrosselOfertas" data-bs-slide="next">
                    <i class="bi bi-chevron-right"></i>
                </button>

            </div>
        </section>

    <!-- FOOTER -->

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
